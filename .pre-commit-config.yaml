---
repos:
  - repo: local
    hooks:
      - id: uv-sync
        name: uv-sync
        description: install dependencies from the lock file
        entry: uv sync --frozen
        language: system
        pass_filenames: false
        stages: [post-checkout, post-merge]
        always_run: true
      - id: uv-lock
        name: uv-lock
        description: check that the lock file is up to date
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(.*/)?(pyproject\.toml|uv\.lock)$
      - id: ruff-lint
        name: ruff-lint
        entry: ruff check
        args:
          [
            --force-exclude,
            --config,
            pyproject.toml,
            --fix,
            --show-fixes,
            --exit-non-zero-on-fix,
          ]
        language: system
        types_or: [python]
        require_serial: true # run once for all files
      - id: ruff-format
        name: ruff-format
        entry: ruff format
        args: [--force-exclude, --config, pyproject.toml]
        language: system
        types_or: [python]
        require_serial: true # run once for all files
      - id: ty
        name: ty
        entry: ty check
        language: system
        types: [python]
        require_serial: true # run once for all files
