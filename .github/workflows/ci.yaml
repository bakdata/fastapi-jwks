name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: .tool-versions
          python-version: ${{ matrix.python-version }}

      - name: Check uv.lock
        run: uv lock --check

      - name: Lint (ruff)
        run: uv run --frozen ruff check . --config pyproject.toml --no-fix --output-format github

      - name: Formatting (ruff)
        run: uv run --frozen ruff format --check

      - name: Typing (ty)
        run: uv run --frozen ty check

      - name: Test
        run: uv run --frozen pytest tests
