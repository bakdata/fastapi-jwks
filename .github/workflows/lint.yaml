name: Lint CI

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/**
      - actions/**
      - mise.toml

jobs:
  jactionlint:
    name: jactionlint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install jactionlint
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_NO_HOOKS: "1"
        with:
          version: "2026.10.5"
          install_args: "jactionlint shellcheck"

      - name: jactionlint
        run: jactionlint --pyflakes= --format=github
