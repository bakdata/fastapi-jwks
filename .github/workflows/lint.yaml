name: Lint CI

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/**
      - actions/**
      - mise.toml

jobs:
  jactionlint:
    name: jactionlint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install jactionlint
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        env:
          MISE_NO_HOOKS: "1"
        with:
          version: "2026.10.5"
          install_args: "jactionlint shellcheck"

      - name: jactionlint
        run: jactionlint --pyflakes= --format=github
